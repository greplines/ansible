---
  - block:
    # Set installation directory information
    - name: Installation Information
      set_fact:
        product_dir: "{{ target }}/apim"
        carbon_home: "{{ target }}/apim/{{ product_name }}-{{ product_version }}"
        server_backup_dir: "{{ backup_dir }}/apim"

    - name: Set carbon_home in /etc/profile.d
      copy:
        content: |
          export carbon_home=/mnt/apim/wso2am-gw-4.5.0
        dest: /etc/profile.d/carbon.sh
        owner: root
        group: root
        mode: '0644'

    # WSO2 AM Gateway Distribution
    - name: Create product directory
      file:
        path: "{{ product_dir }}"
        state: directory
        mode: 0755
      loop:
        - "/mnt/apim"
        - "{{ carbon_home }}"
        - "{{ carbon_home }}/bin"
        - "{{ carbon_home }}/repository"
        - "{{ carbon_home }}/repository/conf"
        - "{{ carbon_home }}/repository/deployment"    

    - name: Copy WSO2AM Gateway service file
      template:
        src: wso2am-gateway.service.j2
        dest: /etc/systemd/system/wso2am-gateway.service

    - name: Stop wso2am gateway as a service
      systemd:
        name: wso2am-gateway
        state: stopped

    - name: Check if deployment resource directory exists
      stat:
        path: "{{ carbon_home }}/repository/deployment/server"
      register: server_dir

    - name: Backup deployment resources
      copy:
        src: "{{ carbon_home }}/repository/deployment/server"
        dest: "{{ server_backup_dir }}"
        remote_src: yes
      when: server_dir.stat.isdir is defined and server_dir.stat.isdir and backup_enabled|bool

    - name: Remove existing setup
      file:
        path: "{{ carbon_home }}"
        state: absent

    - name: Unzip WSO2AM Gateway Package from local source
      unarchive:
        src: "{{ product_package_location }}/packs/{{ product_name }}-{{ product_version }}.zip"
        dest: "{{ product_dir }}"
        mode: u=rw,g=r,o=r
      when: pack_location == "local"

    - name: Unzip WSO2AM Gateway Package from remote source
      unarchive:
        src: "{{ remote_pack }}"
        dest: "{{ product_dir }}"
        mode: u=rw,g=r,o=r
        remote_src: yes
      when: pack_location == "remote"

    - name: Check if backup of deployment resources exists
      stat:
        path: "{{ server_backup_dir }}"
      register: backup_dir

    - name: Restore deployment resources
      copy:
        src: "{{ server_backup_dir }}/server"
        dest: "{{ carbon_home }}/repository/deployment"
        remote_src: yes
      when: backup_dir.stat.isdir is defined and backup_dir.stat.isdir and backup_enabled|bool

    - name: Remove deployment resource backup
      file:
        path: "{{ server_backup_dir }}"
        state: absent

    - name: Copy JDBC Driver
      copy:
        src: "{{ product_package_location }}/lib/{{ jdbc_driver }}"
        dest: "{{ carbon_home }}/repository/components/lib"
      when: jdbc_driver is defined

    - name: Copy configuration templates
      template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      loop:
        - { src: "carbon-home/bin/gateway.sh.j2", 
            dest: "{{ carbon_home }}/bin/gateway.sh" }
       #- { src: "carbon-home/repository/conf/carbon.xml.j2", 
       #    dest: "{{ carbon_home }}/repository/conf/carbon.xml" }
       #- { src: "carbon-home/repository/conf/deployment.toml.j2", 
       #    dest: "{{ carbon_home }}/repository/conf/deployment.toml" }

    - name: Copy security file list for WSO2AM
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      loop: "{{ security_file_list }}"
      when: security_file_list is defined

  #  - name: Create miscellaneous file directory
  #    file:
  #      path: "{{ misc_file_copy_location }}"
  #      state: directory
  #      mode: 0755
  #    when: misc_file_list is defined

  #  - name: Copy miscellaneous resources
  #    copy:
  #      src: "{{ item.src }}"
  #      dest: "{{ item.dest }}"
  #    loop: "{{ misc_file_list }}"
  #    when: misc_file_list is defined

# Enable customization by uncommenting the following and adding the changes to the custom.yml
    # - import_tasks: custom.yml

    - name: Change the owner of WSO2 gateway directory
      file:
        path: "{{ target }}"
        state: directory
        recurse: true
        owner: "{{ wso2_user }}"
        group: "{{ wso2_group }}"
        mode: 0755
    
    - name: Change ownership of WSO2 API Gateway directory
      file:
        path: /mnt/apim/wso2am-gw-4.5.0
        owner: wso2carbon
        group: wso2
        recurse: yes
        state: directory
        mode: 0775

    - name: Set SELinux context for WSO2 binaries
      command: chcon -R -t bin_t "{{ carbon_home }}/bin/gateway.sh"
      command: chcon -R -t bin_t "{{ carbon_home }}/bin/"
      ignore_errors: yes

    when: "(inventory_hostname in groups['apim-gateway'])"
    become: true
    become_user: root

  #- block:
  #  - include: common-tasks/secure-vault.yml
  #    when: secure_vault_enabled|bool

  - name: Start wso2am-gateway as a service
    systemd:
      name: wso2am-gateway
      state: stopped
      daemon_reload: no

  #- name: Ejecutar script Cipher Tool GW.
  #  shell: |
  #    {{ carbon_home }}/bin/ciphertool.sh
  #  register: script_output

    become: true
    become_user: root
