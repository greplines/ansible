---
  - block:
    - name: Create group
      group: name=wso2 state=present gid=802
      become: true

    - name: Add wso2carbon user
      user: name=wso2carbon shell=/bin/bash group=wso2 uid=802 non_unique=yes
      become: true

    #- name: System performance tuning
    #  copy:
    #    src: "{{ item.src }}"
    #    dest: "{{ item.dest }}"
    #  loop: "{{ performance_tuning_file_list }}"
    #  when: enable_performance_tuning|bool

    - name: Configure system performance files
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - { src: 'files/system/etc/security/limits.conf', dest: '/etc/security/limits.conf' }
        - { src: 'files/system/etc/sysctl.conf', dest: '/etc/sysctl.d/99-wso2-tuning.conf' }

    - name: Install unzip package
      package:
        name: unzip
        state: present

    - name: Install tar package
      package:
        name: tar
        state: present

    - name: Create Java directory
      file:
        path: "{{ java_home }}"
        state: directory
      when: (setup_java_enabled | default(true)) | bool

    - name: Unarchive JDK distribution from local source
      unarchive:
        src: "{{ product_package_location }}/lib/{{ jdk_name }}.tar.gz"
        dest: "{{ java_home }}"
        extra_opts: [--strip-components=1]
      when: pack_location == "local" and setup_java_enabled|bool

    #Se descomenta solo si se va a usar.
    #- name: Unarchive JDK distribution from remote source
    #  unarchive:
    #    src: "{{ remote_jdk }}"
    #    dest: "{{ java_home }}"
    #    extra_opts: [--strip-components=1]
    #    remote_src: yes
    #  when: pack_location == "remote" and setup_java_enabled|bool

    - name: Create Java symbolic link
      file:
        src: "{{ java_home }}"
        dest: "{{ java_symlink }}"
        state: link

    - name: Set JAVA_HOME in /etc/profile.d
      copy:
        content: |
          export JAVA_HOME=/opt/java
          export PATH=$JAVA_HOME/bin:$PATH
        dest: /etc/profile.d/java.sh
        owner: root
        group: root
        mode: '0644'

    - name: Create sudoers file for WSO2 user
      copy:
        content: |
          ## WSO2 service permissions
          wso2carbon ALL=(ALL) NOPASSWD: /bin/systemctl start wso2apim, /bin/systemctl stop wso2apim, /bin/systemctl restart wso2apim, /bin/systemctl status wso2apim
        dest: /etc/sudoers.d/wso2
        owner: root
        group: root
        mode: '0440'
    
    - name: reload sysctl configuration
      command: sysctl --system
      
    - name: Reboot system
      ansible.builtin.reboot:
        msg: "System reboot"
        reboot_timeout: 300
    
    become: true
    become_user: root
