wso2_group: wso2 # OS group to be created
wso2_user: wso2carbon # OS user for WSO2 services
product_name: wso2am-gw
product_version: 4.5.0
target: /mnt # Product installation directory
product_package_location: files
backup_dir: /tmp # Artifact backup directory in the instance
misc_file_location: "{{ product_package_location }}/misc"
misc_file_copy_location: "{{ target }}/misc"
security_file_location: "{{ product_package_location }}/security"

# If you uncomment the below line to set the jdbc driver, change the driver name accordingly
jdbc_driver: "mssql-jdbc-13.2.1.jre11.jar"

# vars
carbon_home: "/mnt/apim/wso2am-gw-4.5.0"
#hostname: ""
#localhost: ""

# Set backup_enabled to true to backup <carbon-home>/repository/deployment/server directory
backup_enabled: false

# If custom primary keystores and truststores are need to be added, uncomment the below list
# Add the required files under files/security/<product-home>/<path-to-file>
# A sample is given below
# security_file_list:
#   - { src: '{{ security_file_location }}/wso2am/client-truststore.jks',
#       dest: '{{ carbon_home }}/repository/resources/security/client-truststore.jks' }
#   - { src: '{{ security_file_location }}/wso2am/wso2carbon.jks',
#       dest: '{{ carbon_home }}/repository/resources/security/wso2carbon.jks' }

# If custom tls keystore needs to be added, uncomment the below list
# Add the required files under files/security/<product-home>/<path-to-file>
# A sample is given below
# security_file_list:
#   - { src: '{{ security_file_location }}/wso2am/tls.jks',
#       dest: '{{ carbon_home }}/repository/resources/security/tls.jks' }

# If custom internal keystore needs to be added, uncomment the below list
# Add the required files under files/security/<product-home>/<path-to-file>
# A sample is given below
# security_file_list:
#   - { src: '{{ security_file_location }}/wso2am/internal.jks',
#       dest: '{{ carbon_home }}/repository/resources/security/internal.jks' }

# Uncomment and add any miscellaneous files you need to copy
# A sample is given below
#misc_file_list:
#  - { src: '{{ misc_file_location }}/apicli.zip', dest: '{{ misc_file_copy_location }}/apicli.zip' }

# Set the location the product packages should reside in (eg: "local" in the /files directory, "remote" in a remote location)
pack_location: local
#pack_location: remote
#remote_jdk: "<URL_TO_JDK_FILE>" Ex:- "https://corretto.aws/downloads/latest/amazon-corretto-11-x64-linux-jdk.tar.gz"
#remote_pack: "<URL_TO_APIM_PACK>" Ex:- "https://github.com/wso2/product-apim/releases/download/v4.1.0/wso2am-4.1.0.zip"

# JDK Distributions
setup_java_enabled: true #If this is set to false java_home variable below needs to be specified.
jdk_name: OpenJDK21U-jdk_x64_linux_hotspot_21.0.8_9 # Update this as per jdk version you use
java_dir: /opt
java_symlink: "{{ java_dir }}/java"
java_home: "{{ java_dir }}/{{ jdk_name }}"


# CONFIGURATION Deployment.toml for " APIM Universal Gateway"

# [server]
hostname_s: gateway.bajos.apim.coelsa.com.ar
node-ip: 127.0.0.1
server-role: default

# [user_store]
#type: database_unique_id

# [super_admin]
admin_username: admin
admin_password: admin
#create_admin_account: true

# [database.shared_db] - Datasource configurations
shared_db_type: mssql
shared_db_url: jdbc:sqlserver://SQL-APIM-TA01:1433;databaseName=test_shared_db;SendStringParametersAsUnicode=false
hostname_shared_db: SQL-APIM-TA01
port_shared_db: 1433
name_shared_db: test_shared_db
username_shared_db: sv_apim_user
shared_db_password: nAVoJEs35CIWR972U22q
driver: com.microsoft.sqlserver.jdbc.SQLServerDriver
#validationQuery: SELECT 1

# [keystore.tls] - The KeyStore which is used for encrypting/decrypting internal data. This block is read by Carbon Crypto Service
tls_key_store_name: wso2carbon.jks
#tls_key_store_type: JKS
tls_key_store_key_password: wso2carbon
tls_key_store_password: wso2carbon
tls_key_store_key_alias: wso2carbon

# [truststore] - Client trustore configurations
trust_store_name: client-truststore.jks
trust_store_type: JKS
trust_store_password: wso2carbon

# [transport.http]
properties.port: 9763
properties.proxyPort: 80

# [transport.https]
properties.port: 9443
properties.proxyPort: 443

# Server URL of the Authentication service. Make sure to import the Key Manager's public certificate to WSO2 API-M's
# [apim.key_manager]
key_manager_server_url: https://management.bajos.apim.coelsa.com.ar/services/

# [apim.sync_runtime_artifacts.gateway]
gateway_labels: ["Default"]

# Event Hub configurations
# [apim.event_hub]
enable: true
username: "$ref{super_admin.admin_username}" 
event_listening_endpoints: ["tcp://app-cpcab-ta01.test.coelsaprod.local:5672", "tcp://app-cpcab-tb01.test.coelsaprod.local:5672"]

# Traffic Manager configurations
# [apim.throttling]
throttle_decision_endpoints: ["tcp://app-cpcab-ta01.test.coelsaprod.local:5672", "tcp://app-cpcab-tb01.test.coelsaprod.local:5672"]

# [[apim.throttling.url_group]]
#traffic_manager_urls: ["tcp://app-cpcab-ta01.test.coelsaprod.local:9611"]
#traffic_manager_auth_urls: ["ssl://app-cpcab-ta01.test.coelsaprod.local:9711"]

# [[apim.throttling.url_group]]
#traffic_manager_urls: ["tcp://app-cpcab-tb01.test.coelsaprod.local:9611"]
#traffic_manager_auth_urls: ["ssl://app-cpcab-tb01.test.coelsaprod.local:9711"]

throttle_url_groups:
  - hostname: "app-cpcab-ta01.test.coelsaprod.local"
  - hostname: "app-cpcab-tb01.test.coelsaprod.local"
